<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · Esports</title>
    <style>
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #0B0B0D; color: #F5F5F5; font-family: system-ui, sans-serif; padding: 16px; text-align: center; }
      h1 { font-family: "Barlow Condensed", system-ui, sans-serif; font-weight: 800; text-transform: uppercase; }
      p { color: #A0A0A8; max-width: 28rem; }
      a { color: #E8B33A; display: inline-block; margin-top: 16px; min-height: 44px; line-height: 44px; }
      /* empty-offline artwork (transparent PNG, built by scripts/sync-art.mjs): no box behind it. */
      .art { width: 160px; height: 160px; margin: 0 auto 16px; background: url("/art/empty-offline.png") center / contain no-repeat; background-image: image-set(url("/art/empty-offline-384.webp") type("image/webp"), url("/art/empty-offline.png") type("image/png")); }
    </style>
  </head>
  <body>
    <main>
      <div class="art" data-artwork="empty-offline" aria-hidden="true"></div>
      <h1>You're offline</h1>
      <p>Check your connection. Room IDs and match details need the internet so they are always current.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
