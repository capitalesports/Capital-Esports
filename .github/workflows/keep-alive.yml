name: Keep timers running

# Vercel's Hobby plan runs our crons once a day. Every page view runs the throttled status catch-up
# (registration open/close, 30-minute match reminders, room notices; DECISIONS M27), so opening a
# public page every 5 minutes keeps those on time and keeps the server and database warm (no slow
# first load). No secret is needed. Only during playing hours, 12:00 PM to 11:55 PM IST (06:30 to
# 18:25 UTC; GitHub schedules are in UTC): a database kept awake all day would use up the Neon free
# plan's 100 CU-hours a month (DECISIONS M45). GitHub may delay scheduled runs by a few minutes.
on:
  schedule:
    - cron: "30-55/5 6 * * *"
    - cron: "*/5 7-17 * * *"
    - cron: "0-25/5 18 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Open the scrims page
        run: curl --fail --silent --show-error --retry 3 --retry-delay 5 --max-time 30 -o /dev/null https://capitalesports.in/scrims
