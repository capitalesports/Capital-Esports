name: Keep timers running

# Vercel's Hobby plan runs our crons once a day. Every page view runs the throttled status catch-up
# (registration open/close, 30-minute match reminders, room notices; DECISIONS M27), so opening a
# public page every 5 minutes keeps those on time. No secret is needed. GitHub may delay scheduled
# runs by a few minutes, which the 30-minute reminder window absorbs.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Open the scrims page
        run: curl --fail --silent --show-error --retry 3 --retry-delay 5 --max-time 30 -o /dev/null https://capitalesports.in/scrims
