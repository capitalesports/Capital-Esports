name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, unit + integration tests, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: esports
          POSTGRES_PASSWORD: esports_ci
          POSTGRES_DB: esports
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U esports" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CI: "true"
      DATABASE_URL: postgresql://esports:esports_ci@localhost:5432/esports
      TEST_DATABASE_URL: postgresql://esports:esports_ci@localhost:5432/esports_test
      E2E_DATABASE_URL: postgresql://esports:esports_ci@localhost:5432/esports_e2e
      NEXT_PUBLIC_SITE_URL: http://localhost:3101
      ADMIN_PHONE: "+919999900001"
      AUTH_OTP_STUB: "true"
      PAYMENTS_ENABLED: "false"
      CRON_SECRET: ci-cron-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Session secret for this run
        run: echo "SESSION_SECRET=$(openssl rand -base64 48)" >> "$GITHUB_ENV"

      - name: Install
        run: npm ci

      - name: Create test databases
        run: |
          PGPASSWORD=esports_ci psql -h localhost -U esports -d esports -c "CREATE DATABASE esports_test;"
          PGPASSWORD=esports_ci psql -h localhost -U esports -d esports -c "CREATE DATABASE esports_e2e;"

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: No server-only code reachable from client components
        run: npm run check:client-imports

      - name: Unit + integration tests (with coverage)
        run: npm run test:coverage

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      # Uses the production build the e2e step just made. Fails if any client chunk, any route's
      # first-load JS or the async JS grows >20% over perf/bundle-baseline.json, or if a server-only
      # library appears in a client chunk. Intended growth: rebuild and run `npm run bundle:baseline`.
      - name: Client bundle size budget
        run: npm run bundle:check

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

      - name: Dependency audit (fail on high/critical)
        run: npm audit --audit-level=high

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (full history)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest git /repo --no-banner --redact
